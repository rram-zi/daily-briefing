async function addCategoryFromModal() {
  const input = document.getElementById('new-cat-input');
  const name = input.value.trim();
  if (!name) return;
  if (categoryOptions.some(o => o.name === name)) {
    selectedCategory = name;
    renderCategoryChips();
    closeCategoryModal();
    return;
  }
  const btn = document.getElementById('cat-modal-save-btn');
  btn.disabled = true; btn.textContent = '추가 중...';
  try {
    const existing = categoryOptions.map(o => ({ id: o.id, name: o.name, color: o.color }));
    await notionFetch(`databases/${DB_ID}`, 'PATCH', {
      properties: { '카테고리': { select: { options: [...existing, { name }] } } }
    });
    categoryOptions.push({ name, color: 'default' });
    selectedCategory = name;
    renderCategoryChips();
    closeCategoryModal();
  } catch(e) {
    alert('카테고리 추가 실패: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '추가하기';
  }
}


async function initAuth() {
  try {
    const res = await fetch(`${PROXY}?path=__auth__`, {
      method: 'POST',
      headers: { 'Authorization': `Basic ${AUTH}`, 'Content-Type': 'application/json' }
    });
    if (res.status === 401) return 'unauthorized';
    if (!res.ok) return 'error';
    const data = await res.json();
    DB_ID = data.dbId || '';
    if (DB_ID) localStorage.setItem('app_db_id', DB_ID);
    return !!DB_ID ? 'ok' : 'error';
  } catch { return 'error'; }
}

async function notionFetch(path, method = 'POST', body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Basic ${AUTH}` }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${PROXY}?path=${encodeURIComponent(path)}`, opts);
  if (res.status === 401) {
    AUTH = ''; DB_ID = '';
    localStorage.removeItem('app_auth');
    localStorage.removeItem('app_db_id');
    openConfig();
    throw new Error('인증이 필요합니다');
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

function scrollToToday() {
  const el = document.getElementById('today-filled-state') || document.getElementById('today-empty-state');

}

async function quickAddToday(input) {
  const title = input.value.trim();
  if (!title) return;
  input.value = '';
  input.disabled = true;
  try {
    const today = todayKey();
    const result = await notionFetch('pages', 'POST', {
      parent: { database_id: DB_ID },
      properties: {
        '이름':     { title:  [{ text: { content: title } }] },
        '마감일':   { date:   { start: today } },
        '우선순위': { select: { name: '보통' } },
        '상태':     { status: { name: 'Not started' } },
        '오늘날짜': { date:   { start: today } },
      }
    });
    tasks.unshift({ id: result.id, title, status: '할 일', priority: '일반', dueDate: today, category: '', note: '', done: false, source: '' });
    todayIds.push(result.id);
    todayConfirmed = true;
    saveTodayIds();
    updateStats(); renderTasks(); renderBriefing();
    setStatus('ok', `"${title}" 추가됨`);
  } catch(e) {
    setStatus('err', '추가 실패: ' + e.message);
  }
  input.disabled = false;
  // 렌더 후 새 인풋으로 포커스
  document.querySelector('.today-quick-add-input')?.focus();
}

function hideSplash() {
  const s = document.getElementById('splash');
  if (!s) return;
  s.classList.add('hidden');
  setTimeout(() => s.remove(), 350);
}

async function loadTasks() {
  const btn = document.getElementById('sync-btn');
  btn.classList.add('spinning');
  setStatus('loading', 'Notion에서 할 일을 불러오는 중...');
  try {
    const result = await notionFetch(`databases/${DB_ID}/query`, 'POST', {
      sorts: [
        { property: '우선순위', direction: 'descending' },
        { property: '마감일',   direction: 'ascending'  }
      ]
    });
    tasks = result.results.map(parsePage);
    loadTodayIds();
    renderTodaySection();
    loadCategoryOptions();
    tasks.sort((a, b) => {
      if (a.order !== null && b.order !== null) return a.order - b.order;
      if (a.order !== null) return -1;
      if (b.order !== null) return 1;
      return 0;
    });
    updateStats(); renderTasks(); renderBriefing();
  } catch(e) {
    setStatus('err', '연결 실패: ' + e.message);
    document.getElementById('task-list').innerHTML =
      `<div class="empty-state">Notion 연결에 실패했습니다.<br>
       <small style="font-size:12px;color:var(--text3)">${e.message}</small></div>`;
  } finally {
    btn.classList.remove('spinning');
    hideSplash();
  }
  // splash 이후 백그라운드 처리 — 여기서 hang해도 화면에는 영향 없음
  try {
    await checkWeeklyTask();
    if (_recurringPromise) await _recurringPromise;
    await checkRecurringTasks();
    autoAddCalendarTasks();
    if (_startAction === 'morning') { _startAction = ''; openTodayModal(); }
    else if (_startAction === 'deadline') { _startAction = ''; scrollToToday(); }
    else if (_startAction === 'weekly-report') { _startAction = ''; openWeeklyReportModal(); }
    else if (!todayConfirmed || todayIds.length === 0) openTodayModal();
    const t = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    setStatus('ok', `${tasks.length}개 할 일 동기화 완료 · ${t}`);
  } catch {}
}

function parsePage(page) {
  const p = page.properties;
  const titleKey = Object.keys(p).find(k => p[k].type === 'title') || '이름';
  const g = {
    title:  k => p[k]?.title?.[0]?.plain_text    || p[k]?.rich_text?.[0]?.plain_text || '',
    select: k => p[k]?.select?.name              || '',
    status: k => p[k]?.status?.name              || p[k]?.select?.name               || '',
    date:   k => p[k]?.date?.start               || null,
    text:   k => p[k]?.rich_text?.[0]?.plain_text || ''
  };
  const rawStatus = g.status('상태') || g.status('Status') || 'Not started';
  const statusMap  = { 'Not started': '할 일', 'In progress': '할 일', 'Done': '완료' };
  const status = statusMap[rawStatus] || rawStatus;
  return {
    id:       page.id,
    title:    g.title(titleKey) || '(제목 없음)',
    status,
    priority: ({ '긴급': '긴급' })[g.select('우선순위') || g.select('Priority')] || '일반',
    dueDate:  g.date('마감일') || g.date('Due') || g.date('날짜'),
    category: g.select('카테고리') || g.select('Category') || '',
    note:        g.text('메모') || g.text('Notes') || '',
    done:        rawStatus === 'Done' || rawStatus === '완료',
    order:       p['순서']?.number ?? null,
    completedAt: p['완료일']?.date?.start ?? null,
    todayDate:   g.date('오늘날짜') || null,
    source:      g.text('소스'),
    location:    g.text('위치'),
  };
}

function updateStats() {
  const total = tasks.length;
  const done  = tasks.filter(t =>  t.done).length;
  const todo  = tasks.filter(t => !t.done).length;
  document.getElementById('fc-all').textContent  = `전체(${total})`;
  document.getElementById('fc-todo').textContent = `할 일(${todo})`;
  document.getElementById('fc-done').textContent = `완료(${done})`;
}

async function checkWeeklyTask() {
  const now = new Date();
  if (now.getDay() !== 0) return;           // 일요일만
  if (now.getHours() < 10) return;          // 오전 10시 이후만
  const sunday = localDateStr(now);
  if (localStorage.getItem('weekly_task_sunday') === sunday) return; // 이미 생성함
  const TITLE = '주간 회고 작성';
  if (tasks.some(t => !t.done && t.title === TITLE)) {             // 이미 존재하면 스킵
    localStorage.setItem('weekly_task_sunday', sunday); return;
  }
  try {
    const result = await notionFetch('pages', 'POST', {
      parent: { database_id: DB_ID },
      properties: {
        '이름':     { title:  [{ text: { content: TITLE } }] },
        '우선순위': { select: { name: '보통' } },
        '상태':     { status: { name: 'Not started' } },
        '마감일':   { date: { start: sunday } }
      }
    });
    tasks.unshift({ id: result.id, title: TITLE, status: '할 일', priority: '보통',
      dueDate: sunday, category: '', note: '', done: false, order: null, completedAt: null });
    localStorage.setItem('weekly_task_sunday', sunday);
    updateStats(); renderTasks();
    setStatus('ok', '주간 회고 작성 할 일이 추가됐습니다');
  } catch(e) { /* 실패해도 무시 */ }
}

// 터치 드래그 전역 상태
let _tdSrc = null, _tdCont = null, _tdOnDrop = null, _tdGhost = null, _tdOX = 0, _tdOY = 0;
(function() {
  document.addEventListener('touchmove', function(e) {
    if (!_tdSrc || !_tdGhost) return;
    e.preventDefault();
    const t = e.touches[0];
    _tdGhost.style.left = (t.clientX - _tdOX) + 'px';
    _tdGhost.style.top  = (t.clientY - _tdOY) + 'px';
    _tdGhost.style.visibility = 'hidden';
    const el = document.elementFromPoint(t.clientX, t.clientY);
    _tdGhost.style.visibility = '';
    _tdCont.querySelectorAll('.task-item').forEach(i => i.classList.remove('drag-over'));
    const ti = el && el.closest('.task-item');
    if (ti && ti.dataset.id !== _tdSrc) ti.classList.add('drag-over');
  }, { passive: false });
  document.addEventListener('touchend', function(e) {
    if (!_tdSrc) return;
    const t = e.changedTouches[0];
    if (_tdGhost) _tdGhost.style.visibility = 'hidden';
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (_tdGhost) { _tdGhost.remove(); _tdGhost = null; }
    _tdCont.querySelectorAll('.task-item').forEach(i => i.classList.remove('dragging', 'drag-over'));
    const ti = el && el.closest('.task-item');
    if (ti && ti.dataset.id !== _tdSrc) _tdOnDrop(_tdSrc, ti.dataset.id);
    _tdSrc = null; _tdCont = null; _tdOnDrop = null;
  });
})();

function attachDrag(container, onDrop) {
  let dragSrc = null;
  container.querySelectorAll('.task-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragSrc = item.dataset.id;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => item.classList.add('dragging'), 0);
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      container.querySelectorAll('.task-item').forEach(i => i.classList.remove('drag-over'));
    });
    item.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    item.addEventListener('dragenter', e => {
      e.preventDefault();
      if (item.dataset.id !== dragSrc) item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      if (!dragSrc || dragSrc === item.dataset.id) return;
      onDrop(dragSrc, item.dataset.id);
    });
  });
  // 터치 드래그 (모바일)
  container.querySelectorAll('.drag-handle').forEach(handle => {
    handle.addEventListener('touchstart', function(e) {
      const item = handle.closest('.task-item');
      if (!item) return;
      const touch = e.touches[0];
      const rect = item.getBoundingClientRect();
      _tdSrc = item.dataset.id;
      _tdCont = container;
      _tdOnDrop = onDrop;
      _tdOX = touch.clientX - rect.left;
      _tdOY = touch.clientY - rect.top;
      _tdGhost = item.cloneNode(true);
      Object.assign(_tdGhost.style, {
        position: 'fixed', zIndex: '9999', pointerEvents: 'none',
        width: rect.width + 'px', opacity: '0.85',
        left: rect.left + 'px', top: rect.top + 'px',
        margin: '0', transition: 'none',
        boxShadow: '0 8px 24px rgba(0,0,0,0.12)',
      });
      document.body.appendChild(_tdGhost);
      item.classList.add('dragging');
      e.preventDefault();
    }, { passive: false });
  });
}

function renderTasks() {
  const isRecurring = t => recurringTasks.some(r => r.title === t.title);
  const hasActiveInstance = t => tasks.some(o => o.id !== t.id && o.title === t.title && !o.done);

  // 완료 태스크를 제목 기준으로 그룹화 (isRecurring 무관하게 중복 제거)
  const doneByTitle = new Map();
  tasks.forEach(t => {
    if (!t.done) return;
    if (!doneByTitle.has(t.title)) doneByTitle.set(t.title, []);
    doneByTitle.get(t.title).push(t);
  });
  // 중복 제거: 제목당 대표 1개만 남기고 나머지 id는 제외 목록에 추가
  const excludedDoneIds = new Set();
  const extraDatesMap = new Map(); // representative id → extra completedAt[]
  doneByTitle.forEach(group => {
    if (group.length <= 1) return;
    const sorted = [...group].sort((a, b) => (a.completedAt || '').localeCompare(b.completedAt || ''));
    const rep = sorted[0];
    extraDatesMap.set(rep.id, sorted.slice(1).map(t => t.completedAt).filter(Boolean));
    sorted.slice(1).forEach(t => excludedDoneIds.add(t.id));
  });

  const seenTodayTitles = new Set();
  const todayTasks = todayIds.map(id => tasks.find(t => t.id === id)).filter(Boolean)
    .sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0)) // 미완료 우선
    .filter(t => { if (seenTodayTitles.has(t.title)) return false; seenTodayTitles.add(t.title); return true; })
    .sort((a, b) => (b.done ? 1 : 0) - (a.done ? 1 : 0)); // 완료된 것 아래로

  const allOtherTasks = tasks.filter(t => {
    if (excludedDoneIds.has(t.id)) return false;
    if (t.done && hasActiveInstance(t)) return false;
    if (currentFilter === 'done' && !t.done) return false;
    if (currentFilter === 'todo' && t.done && !isRecurring(t)) return false;
    if (currentCategories !== null && t.category && !currentCategories.has(t.category)) return false;
    if (taskSearchQuery && !t.title.toLowerCase().includes(taskSearchQuery.toLowerCase())) return false;
    return true;
  }).map(t => extraDatesMap.has(t.id) ? { ...t, _extraDates: extraDatesMap.get(t.id) } : t)
    .sort((a, b) => {
      const score = t => {
        if (t.done && !isRecurring(t)) return 2;
        const urgent  = t.priority === '긴급' ? 1 : 0;
        const overdue = isOverdue(t.dueDate)  ? 1 : 0;
        if (urgent && overdue) return -2;
        if (urgent || overdue) return -1;
        return 0;
      };
      const sa = score(a), sb = score(b);
      if (sa !== sb) return sa - sb;
      if (a.done && b.done) return (b.completedAt || '').localeCompare(a.completedAt || '');
      return 0;
    });

  const todayList = document.getElementById('today-list');
  const quickAddRow = `<div class="today-quick-add" onclick="this.querySelector('input').focus()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <input class="today-quick-add-input" type="text" placeholder="빠르게 추가..."
      onkeydown="if(event.key==='Enter'&&this.value.trim())quickAddToday(this)">
  </div>`;
  todayList.innerHTML = (todayTasks.length
    ? todayTasks.map(t => taskItemHTML(t, true, true)).join('')
    : '<div class="empty-state">선택한 할 일이 없어요. 수정 버튼으로 추가해보세요</div>')
    + quickAddRow;

  const list = document.getElementById('task-list');
  list.innerHTML = allOtherTasks.length
    ? allOtherTasks.map(t => taskItemHTML(t, false, false, false)).join('')
    : '<div class="empty-state">해당하는 할 일이 없습니다</div>';

  const metaEl = document.getElementById('task-search-meta');
  const labelEl = document.getElementById('task-search-result-label');
  if (taskSearchQuery) {
    labelEl.textContent = `검색 결과 ${allOtherTasks.length}`;
    metaEl.classList.add('visible');
  } else {
    metaEl.classList.remove('visible');
  }

  attachDrag(todayList, (srcId, dstId) => {
    const si = todayIds.indexOf(srcId), di = todayIds.indexOf(dstId);
    if (si === -1 || di === -1) return;
    const [m] = todayIds.splice(si, 1);
    todayIds.splice(di, 0, m);
    saveTodayIds();
    renderTasks();
  });

}

let selectedLocation = '';

function parseLocation(raw) {
  if (!raw) return { name: '', url: '' };
  const sep = raw.indexOf('|||');
  if (sep === -1) return { name: raw, url: '' };
  return { name: raw.slice(0, sep), url: raw.slice(sep + 3) };
}

function initLocationField(raw) {
  selectedLocation = raw || '';
  const { name } = parseLocation(raw);
  const sel = document.getElementById('location-selected');
  const btn = document.getElementById('location-add-btn');
  sel.style.display = name ? 'flex' : 'none';
  document.getElementById('location-selected-name').textContent = name ? `📍 ${name}` : '';
  if (btn) btn.style.display = name ? 'none' : '';
}

async function runLocationSearch(q) {
  if (!q) return;
  const el = document.getElementById('location-modal-results');
  el.innerHTML = `<div class="location-result-item" style="color:var(--text3)">검색 중...</div>`;
  try {
    const res = await fetch(`/api/kakao-place?q=${encodeURIComponent(q)}`, {
      headers: { Authorization: `Basic ${AUTH}` },
    });
    const json = await res.json();
    if (!res.ok) {
      el.innerHTML = `<div class="location-result-item" style="color:var(--red500)">오류: ${json.error || res.status}</div>`;
      return;
    }
    const { places } = json;
    if (!places.length) {
      el.innerHTML = `<div class="location-result-item" style="color:var(--text3)">검색 결과가 없어요</div>`;
      return;
    }
    el.innerHTML = places.map(p =>
      `<div class="location-result-item"
        data-name="${p.name.replace(/"/g,'&quot;')}"
        data-url="${(p.url||'').replace(/"/g,'&quot;')}"
        onclick="selectPlace(this.dataset.name, this.dataset.url)">

async function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('할 일 이름을 입력해주세요'); return; }

  const taskType = document.getElementById('f-task-type').dataset.value;
  const isRepeat = taskType === 'repeat';

  // 신규 + 반복: 템플릿만 저장하고 Notion 페이지는 생성 안 함
  if (!editingId && isRepeat) {
    const days = [...document.querySelectorAll('#f-days .day-btn.active')].map(b => b.dataset.day);
    if (days.length === 0) { alert('반복 요일을 선택해주세요'); return; }
    const priority = document.getElementById('f-priority').dataset.value;
    const category = selectedCategory;
    const note     = document.getElementById('f-note').value.trim();
    const rt = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      title, days, priority, category, note
    };
    recurringTasks.push(rt);
    saveRecurring();
    closeModal();
    await checkRecurringTasks();
    setStatus('ok', `반복 할 일 "${title}" 이(가) 저장됐습니다 (${days.join(', ')} 반복)`);
    return;
  }

  // 편집 시 반복 템플릿 동기화
  if (editingId) {
    const priority = document.getElementById('f-priority').dataset.value;
    const category = selectedCategory;
    const note     = document.getElementById('f-note').value.trim();

    if (isRepeat) {
      const days = [...document.querySelectorAll('#f-days .day-btn.active')].map(b => b.dataset.day);
      if (days.length === 0) { alert('반복 요일을 선택해주세요'); return; }
      if (editingRecurringId) {
        const rt = recurringTasks.find(r => r.id === editingRecurringId);
        if (rt) { rt.title = title; rt.days = days; rt.priority = priority; rt.category = category; rt.note = note; }
      } else {
        const newRt = { id: Date.now().toString(36) + Math.random().toString(36).slice(2), title, days, priority, category, note };
        recurringTasks.push(newRt);
        editingRecurringId = newRt.id;
      }
      saveRecurring();
    } else if (editingRecurringId) {
      // 반복→1회성으로 변경: 템플릿 종료
      recurringTasks = recurringTasks.filter(r => r.id !== editingRecurringId);
      saveRecurring();
      editingRecurringId = null;
    }
  }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = '저장 중...';
  setStatus('loading', 'Notion에 저장 중...');

  const dueDate  = document.getElementById('f-date').value;
  const priority = document.getElementById('f-priority').dataset.value;
  const category = selectedCategory;
  const status   = document.getElementById('f-status').dataset.value;
  const note     = document.getElementById('f-note').value.trim();
  const location = selectedLocation;

  const props = {
    '이름':     { title:  [{ text: { content: title } }] },
    '우선순위': { select: { name: toNotionPriority(priority) } },
    '상태':     { status: { name: status } },
    '마감일':   dueDate  ? { date: { start: dueDate } } : { date: null },
    '카테고리': category ? { select: { name: category } } : { select: null },
    '메모':     { rich_text: note ? [{ text: { content: note } }] : [] },
    '위치': { rich_text: location ? [{ text: { content: location } }] : [] },
  };

  const statusMap = { 'Not started': '할 일', 'In progress': '할 일', 'Done': '완료' };

  try {
    if (editingId) {
      await notionFetch(`pages/${editingId}`, 'PATCH', { properties: props });
      const t = tasks.find(t => t.id === editingId);
      if (t) {
        t.title    = title;
        t.priority = priority;
        t.status   = statusMap[status] || status;
        t.dueDate  = dueDate  || null;
        t.category = category;
        t.note     = note;
        t.location = location;
        t.done     = status === 'Done';
      }
      setStatus('ok', '할 일이 수정됐습니다');
    } else {
      const result = await notionFetch('pages', 'POST', {
        parent: { database_id: DB_ID },
        properties: props
      });
      tasks.unshift({
        id: result.id, title,
        status: statusMap[status] || status,
        priority, dueDate: dueDate || null, category, note, location,
        done: status === 'Done'
      });
      setStatus('ok', '새 할 일이 Notion에 저장됐습니다');
    }
    updateStats(); renderTasks(); renderBriefing();
    closeModal();
  } catch(e) {
    setStatus('err', '저장 실패: ' + e.message);
  }

  btn.disabled = false;
  btn.textContent = editingId ? '수정 완료' : '저장';
}

function buildDoneMap() {

  tasks.filter(t => t.done && t.completedAt).forEach(t => {

function buildChip(t) {
  const opt = categoryOptions.find(o => o.name === t.category);
  const cn  = opt?.color || 'default';
  const BG  = { default:'#8B95A1', gray:'#6B7684', brown:'#9F8062', orange:'#D9730D', yellow:'#CB912F', green:'#448361', blue:'#337EA9', purple:'#9065B0', pink:'#C14C8A', red:'#D44C47' };
  const bg  = BG[cn] || BG.default;
  const catEmoji = t.category ? [...t.category][0] : '';
  const catHtml = catEmoji ? `<span class="cal-chip-cat">${tfEmoji(catEmoji)}</span>` : '';
  return `<button class="cal-task-chip" style="background:${bg}" onclick="openTaskDetail('${t.id}')">${catHtml}<span class="cal-chip-title">${tfEmoji(t.title)}</span></button>`;

  historyView = view;

  renderHistory();

function isAtCurrentPeriod() {
  const now = new Date(Date.now() - DAY_CUTOFF_HOURS * 60 * 60 * 1000);
  if (historyView === 'month') {
    return historyMonth.getFullYear() === now.getFullYear() && historyMonth.getMonth() === now.getMonth();
  } else {
    const base = new Date(historyWeek);
    base.setDate(base.getDate() - base.getDay());
    const nowBase = new Date(now);
    nowBase.setDate(nowBase.getDate() - nowBase.getDay());
    return base >= nowBase;
  }
}

function updateCalNavButtons() {
  const btn = document.getElementById('cal-next-btn');
  if (!btn) return;
  const disable = isAtCurrentPeriod();
  btn.disabled = disable;
  btn.style.opacity = disable ? '0.3' : '';
  btn.style.pointerEvents = disable ? 'none' : '';
}

function changeCalPeriod(delta) {
  if (delta > 0 && isAtCurrentPeriod()) return;
  if (historyView === 'month') {
    historyMonth = new Date(historyMonth.getFullYear(), historyMonth.getMonth() + delta, 1);
  } else {
    historyWeek = new Date(historyWeek.getTime() + delta * 7 * 24 * 60 * 60 * 1000);
  }
  renderHistory();
}

function renderHistory() {
  if (historyView === 'week') renderHistoryWeek();
  else renderHistoryMonth();
}

function renderHistoryMonth() {
  const y = historyMonth.getFullYear(), m = historyMonth.getMonth();
  document.getElementById('cal-month-label').textContent = `${y}년 ${m + 1}월`;

  const doneMap = buildDoneMap();
  const today = todayKey();
  const q = historySearch.toLowerCase();
  const firstDay    = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const daysInPrev  = new Date(y, m, 0).getDate();

  const cells = [];
  for (let i = firstDay - 1; i >= 0; i--) cells.push({ day: daysInPrev - i, cur: false });
  for (let d = 1; d <= daysInMonth; d++)   cells.push({ day: d, cur: true });
  const rem = cells.length % 7 === 0 ? 0 : 7 - (cells.length % 7);
  for (let d = 1; d <= rem; d++)            cells.push({ day: d, cur: false });

  document.getElementById('cal-grid').innerHTML = cells.map(c => {
    if (!c.cur) return `<div class="cal-day other-month"><span class="cal-day-num">${c.day}</span></div>`;
    const dateStr  = `${y}-${String(m+1).padStart(2,'0')}-${String(c.day).padStart(2,'0')}`;
    const dayTasks = (doneMap[dateStr] || []).filter(t => !q || t.title.toLowerCase().includes(q));
    const holiday = isHoliday(dateStr);
    const chips = dayTasks.map(buildChip).join('');
    const cls = [dateStr === today ? 'is-today' : '', holiday ? 'is-holiday' : ''].filter(Boolean).join(' ');
    return `<div class="cal-day ${cls}"><span class="cal-day-num">${c.day}</span>${chips}</div>`;
  }).join('');

  equalizeCalHeights(window.innerWidth > 680 ? 96 : 80);
  renderCalStats();
  updateCalNavButtons();
}

function renderHistoryWeek() {
  const base = new Date(historyWeek);
  base.setDate(base.getDate() - base.getDay()); // 해당 주 일요일
  const end = new Date(base);
  end.setDate(base.getDate() + 6);

  const fmtShort = d => `${d.getMonth()+1}.${d.getDate()}`;
  document.getElementById('cal-month-label').textContent =
    `${base.getFullYear()}년 ${fmtShort(base)} ~ ${fmtShort(end)}`;

  const doneMap = buildDoneMap();
  const today = todayKey();
  const q = historySearch.toLowerCase();

  document.getElementById('cal-grid').innerHTML = Array.from({ length: 7 }, (_, i) => {
    const day = new Date(base);
    day.setDate(base.getDate() + i);
    const dateStr = localDateStr(day);
    const dayTasks = (doneMap[dateStr] || []).filter(t => !q || t.title.toLowerCase().includes(q));
    const holiday = isHoliday(dateStr);
    const chips = dayTasks.map(buildChip).join('');
    const cls = [dateStr === today ? 'is-today' : '', holiday ? 'is-holiday' : ''].filter(Boolean).join(' ');
    return `<div class="cal-day ${cls}"><span class="cal-day-num">${day.getDate()}</span>${chips}</div>`;
  }).join('');

  equalizeCalHeights(window.innerWidth > 680 ? 200 : 150);
  renderCalStats();
  updateCalNavButtons();
}

function renderCalStats() {
  const doneMap = buildDoneMap();

  let html = '';
  if (historyView === 'month') {
    const y = historyMonth.getFullYear(), mo = historyMonth.getMonth();
    const prefix = `${y}-${String(mo + 1).padStart(2, '0')}`;
    const count = Object.entries(doneMap)
      .filter(([k]) => k.startsWith(prefix))
      .reduce((s, [, arr]) => s + arr.length, 0);
    html = `<div class="cal-stat"><div class="cal-stat-num">${count}</div><div class="cal-stat-label">이번 달 완료</div></div>`;
  } else {
    const base = new Date(historyWeek);
    base.setDate(base.getDate() - base.getDay()); // 해당 주 일요일
    const count = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(base);
      d.setDate(base.getDate() + i);
      return localDateStr(d);
    }).reduce((s, d) => s + (doneMap[d]?.length || 0), 0);
    html = `<div class="cal-stat"><div class="cal-stat-num">${count}</div><div class="cal-stat-label">이번 주 완료</div></div>`;
  }
  document.getElementById('cal-stats').innerHTML = html;
}

function openTaskDetail(taskId) {

  // 헤더: 제목 + 카테고리

    ? `<span class="badge badge-cat">${tfEmoji(t.category)}</span>` : '';

  // meta: 긴급 뱃지 + (미완료일 때만) 마감일
  const metaParts = [
    t.priority === '긴급' ? `<span class="badge badge-urgent">긴급</span>` : '',
    (!t.done && t.dueDate) ? `<span class="badge badge-date"><img class="t-emoji" src="/emoji/u1F4C5.svg" alt="📅"> ${fmt(t.dueDate)}</span>` : '',
  ].filter(Boolean);
  const detailMeta = document.getElementById('detail-meta');
  detailMeta.innerHTML = metaParts.join('');
  detailMeta.style.display = metaParts.length ? '' : 'none';

  // note
  const noteHtml = t.note ? linkify(tfEmoji(t.note)).replace(/\n/g, '<br>') : '';
  const detailNote = document.getElementById('detail-note');
  detailNote.innerHTML = noteHtml;
  detailNote.style.display = noteHtml ? '' : 'none';
  detailNote.style.marginTop = metaParts.length ? '14px' : '0';

  // footer: 완료 일자 + 위치 (완료된 경우만)
  const { name: locName, url: locUrl } = parseLocation(t.location);
  const locBadge = locName
    ? `<a class="badge badge-location" href="${locUrl || 'https://map.kakao.com/?q=' + encodeURIComponent(locName)}" target="_blank" onclick="event.stopPropagation()">📍 ${locName}</a>`
    : '';
  const detailFooter = document.getElementById('detail-footer');
  if (t.completedAt) {
    detailFooter.innerHTML = `<span style="font-size:12px;color:var(--text3)">${fmt(t.completedAt)} 완료</span>${locBadge}`;
    detailFooter.style.display = '';

    detailFooter.innerHTML = locBadge;
    detailFooter.style.display = '';
    detailFooter.style.marginTop = (noteHtml || metaParts.length) ? '14px' : '0';
  } else {
    detailFooter.innerHTML = '';
    detailFooter.style.display = 'none';
  }

  document.getElementById('detail-backdrop').classList.add('open');
  lockScroll();
}

function renderCatFilterDropdown() {
  const dd = document.getElementById('cat-filter-dropdown');
  const cats = [...new Set(tasks.map(t => t.category).filter(Boolean))];
  dd.innerHTML = '';
  cats.forEach(cat => {
    const isChecked = currentCategories === null || currentCategories.has(cat);
    const el = document.createElement('div');
    el.className = 'cat-filter-option' + (isChecked ? ' checked' : '');
    el.innerHTML = `<span class="cat-filter-check"><svg viewBox="0 0 12 10"><polyline points="1,5 4.5,9 11,1"/></svg></span>${tfEmoji(cat)}`;
    el.addEventListener('click', () => {
      if (currentCategories === null) {
        // 전체 선택 상태 → 이 항목만 해제
        currentCategories = new Set(cats.filter(c => c !== cat));
      } else {
        if (currentCategories.has(cat)) {
          currentCategories.delete(cat);
        } else {
          currentCategories.add(cat);
          if (currentCategories.size === cats.length) currentCategories = null;
        }
      }
      el.classList.toggle('checked', currentCategories === null || currentCategories.has(cat));
      updateCatFilterUI();
      renderTasks();
    });
    dd.appendChild(el);
  });
  const resetBtn = document.createElement('button');
  resetBtn.className = 'cat-filter-reset';
  resetBtn.textContent = '초기화';
  resetBtn.onclick = () => { currentCategories = null; renderCatFilterDropdown(); updateCatFilterUI(); renderTasks(); };
  dd.appendChild(resetBtn);
}
function closeCatFilter() {

function getWeekReportRange(refDate) {
  const days = ['일','월','화','수','목','금','토'];
  const fmt = d => `${d.getMonth()+1}.${d.getDate()}(${days[d.getDay()]})`;
  let sunday, saturday;
  if (refDate) {
    // 캘린더에서 선택한 주: refDate가 속한 주(일~토)
    const base = new Date(refDate);
    sunday = new Date(base); sunday.setDate(base.getDate() - base.getDay());
    saturday = new Date(sunday); saturday.setDate(sunday.getDate() + 6);
  } else {
    // 알림에서 호출: 가장 최근 완료된 주(지난 일~토)
    const now = new Date(Date.now() - DAY_CUTOFF_HOURS * 60 * 60 * 1000);
    const day = now.getDay();
    const daysSinceSat = day === 0 ? 1 : day === 6 ? 0 : day + 1;
    saturday = new Date(now); saturday.setDate(now.getDate() - daysSinceSat);
    sunday = new Date(saturday); sunday.setDate(saturday.getDate() - 6);
  }
  return { mondayStr: localDateStr(sunday), saturdayStr: localDateStr(saturday),
           label: `${fmt(sunday)} ~ ${fmt(saturday)}` };
}

let _weeklyReportRef = null;
function openWeeklyReportModal(refDate) {
  _weeklyReportRef = refDate || null;
  const { mondayStr, saturdayStr, label } = getWeekReportRange(refDate);
  document.getElementById('weekly-report-range').textContent = label;

  const weekTasks = tasks.filter(t =>
    t.done && t.completedAt &&
    t.completedAt >= mondayStr && t.completedAt <= saturdayStr
  );
  const count = weekTasks.length;

  // 카테고리별 집계
  const catMap = {};
  for (const t of weekTasks) {
    const k = t.category || '';
    if (!catMap[k]) catMap[k] = [];
    catMap[k].push(t);
  }
  const topCat = Object.entries(catMap)
    .filter(([k]) => k)
    .sort((a, b) => b[1].length - a[1].length)[0];

  document.getElementById('weekly-report-summary').innerHTML =
    `<div class="weekly-stat-card">
       <div class="weekly-stat-num">${count}개</div>
       <div class="weekly-stat-label">이번 주 완료</div>
     </div>
     <div class="weekly-stat-card">
       <div class="weekly-stat-num" style="font-size:18px">${topCat ? tfEmoji(topCat[0]) : '–'}</div>
       <div class="weekly-stat-label">${topCat ? `최다 카테고리 · ${topCat[1].length}개` : '카테고리 없음'}</div>
     </div>`;

  const listEl = document.getElementById('weekly-report-list');
  if (count === 0) {
    listEl.innerHTML = '<div class="empty-state">이번 주 완료한 할 일이 없어요.</div>';
  } else {
    const sorted = Object.entries(catMap).sort((a, b) => {
      if (!a[0]) return 1; if (!b[0]) return -1;
      return b[1].length - a[1].length;
    });
    listEl.innerHTML = sorted.map(([cat, ts]) =>
      `<div class="weekly-cat-section">
         <div class="weekly-cat-header">
           <span>${cat ? tfEmoji(cat) : '카테고리 없음'}</span>
           <span style="font-weight:400;color:var(--text3)">${ts.length}개</span>
         </div>
         ${ts.map(t =>
           `<div class="weekly-task-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--blue500)" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>
              ${tfEmoji(t.title)}
            </div>`
         ).join('')}
       </div>`
    ).join('');
  }

  document.getElementById('weekly-report-backdrop').classList.add('open');
  lockScroll();
}

  unlockScroll();
}

async function copyWeeklyReport() {
  const { mondayStr, saturdayStr, label } = getWeekReportRange(_weeklyReportRef);
  const weekTasks = tasks.filter(t =>
    t.done && t.completedAt &&
    t.completedAt >= mondayStr && t.completedAt <= saturdayStr
  );

  const catMap = {};
  for (const t of weekTasks) {
    const k = t.category || '';
    if (!catMap[k]) catMap[k] = [];
    catMap[k].push(t);
  }
  const sorted = Object.entries(catMap).sort((a, b) => {
    if (!a[0]) return 1; if (!b[0]) return -1;
    return b[1].length - a[1].length;
  });

  const lines = [`📅 ${label} 주간 레포트`, `총 ${weekTasks.length}개 완료`, ''];
  for (const [cat, ts] of sorted) {
    lines.push(`${cat || '카테고리 없음'} (${ts.length}개)`);
    for (const t of ts) lines.push(`- ${t.title}`);
    lines.push('');
  }

  const text = lines.join('\n').trimEnd();
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('weekly-copy-btn');
    btn.textContent = '복사했어요!';

    }, 2000);
  } catch {
    alert(text);
  }
}

async function _requestPermission(toggleEl) {
  if (Notification.permission === 'denied') {
    alert('브라우저 알림 권한이 차단되어 있습니다. 브라우저 설정에서 알림을 허용해주세요.');
    toggleEl.checked = false;
    return false;
  }
  if (Notification.permission === 'default') {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toggleEl.checked = false; return false; }
  }
  return true;
}

async function _unsubscribePush(type) {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) return;
    await fetch(`/api/push-subscribe?type=${type}`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Basic ${AUTH}` },
      body: JSON.stringify({ endpoint: sub.endpoint }),
    });
    // 모든 타입이 off일 때만 브라우저 구독 해제
    const allOff = ['push_morning', 'push_deadline', 'push_check', 'push_weekly']
      .filter(k => k !== `push_${type}`)
      .every(k => localStorage.getItem(k) !== 'on');
    if (allOff) await sub.unsubscribe();
  } catch (e) {
    console.warn('Push 구독 해제 실패:', e);
  }
}

function isOverdue(d) {

  const dt = new Date(d); const today = new Date(); today.setHours(0,0,0,0); return dt < today;

function fmt(d) { const dt = new Date(d); return `${dt.getMonth()+1}/${dt.getDate()}`; }
function fmtKo(d) { const dt = new Date(d); return `${dt.getMonth()+1}월 ${dt.getDate()}일`; }
function toggleCompletedTooltip(e, el) {

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const _TF_CDN = 'https://cdn.jsdelivr.net/gh/toss/tossface/dist/svg/';
const _TF_SEG = typeof Intl !== 'undefined' && Intl.Segmenter
  ? new Intl.Segmenter('und', { granularity: 'grapheme' }) : null;
const _TF_RE  = /^\p{Emoji_Presentation}|^\p{Extended_Pictographic}/u;

function linkify(html) {
  return html.replace(/(?<![="'])(https?:\/\/[^\s<>"']+)/g,
    url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

function tfEmoji(raw) {
  if (!raw) return '';
  const segs = _TF_SEG ? [..._TF_SEG.segment(raw)].map(s => s.segment) : [...raw];
  return segs.map(seg => {
    if (!_TF_RE.test(seg) && !seg.includes('⃣')) {
      return seg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    const name = [...seg]
      .map(ch => ch.codePointAt(0))
      .filter(cp => cp !== 0xFE0F)
      .map(cp => 'u' + cp.toString(16).toUpperCase())
      .join('_');
    return `<img class="t-emoji" src="${_TF_CDN}${name}.svg" alt="${seg}">`;
  }).join('');
}

function _urlB64ToUint8(b64) {
